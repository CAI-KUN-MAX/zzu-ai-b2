# 简历诊断前端 + 后端反向代理（替代 python -m http.server）
# 放到 /etc/nginx/conf.d/resume-diagnose.conf，nginx -t 检查后 systemctl reload nginx
server {
    listen 80;
    server_name 8.163.105.39;

    # 前端构建产物：cd frontend && npm run build 后把 dist/ 拷到这里
    root /var/www/resume-diagnose;
    index index.html;

    # 与后端 2 万字上限对应，留出 JSON 转义余量
    client_max_body_size 256k;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 同源转发到后端，前端 VITE_API_BASE 留空即可，不再需要跨域
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 后端模型调用总超时 60 秒，这里略大于它
        proxy_read_timeout 70s;
    }
}
