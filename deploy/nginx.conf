# 简历诊断前端 + 后端反向代理（替代 python -m http.server）
# 放到 /etc/nginx/conf.d/resume-diagnose.conf，nginx -t 检查后 systemctl reload nginx

# 按接口成本分三档限流（均按客户端 IP）：
# - llm_limit：会调用付费大模型的 POST /api/diagnose、POST /api/match、模拟面试的两个 POST，共用每分钟 10 次
# - upload_limit：POST /api/resumes/batch。前端每批最多 5 份、50MB，20 份简历约 4 个请求
# - poll_limit：任务轮询、全文、导出等只读请求。前端每 1–3 秒轮询一次，多批时每次查询多个任务
limit_req_zone $binary_remote_addr zone=llm_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=poll_limit:10m rate=240r/m;

server {
    listen 80;
    server_name 8.163.105.39;

    # 保留 ACME HTTP-01 校验；其他请求全部升级到 HTTPS。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/resume-diagnose;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name 8.163.105.39;

    # Let's Encrypt IP 证书（Certbot 5.4+，shortlived profile）。
    ssl_certificate /etc/letsencrypt/live/8.163.105.39/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.163.105.39/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # 前端构建产物：cd frontend && npm run build 后把 dist/ 拷到这里
    root /var/www/resume-diagnose;
    index index.html;

    # 默认请求体上限：与后端 2 万字上限对应，留出 JSON 转义余量；上传接口单独放宽
    client_max_body_size 256k;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 同源转发到后端，前端 VITE_API_BASE 留空即可，不再需要跨域
    limit_req_status 429;
    error_page 429 = @rate_limited;
    error_page 413 = @too_large;

    # 单份文本诊断：后端模型调用总超时 75 秒，这里略大于它
    location = /api/diagnose {
        limit_req zone=llm_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 85s;
    }

    # 创建匹配任务：立即返回 task_id，AI 分析在后台进行；与诊断共用高成本额度
    location = /api/match {
        limit_req zone=llm_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 批量上传：前端按 5 份 / 50MB 拆批，单个请求最多约 50MB + multipart 开销。
    # 不拆批的客户端一次传 20×15MB 会超过这里的上限，需改用拆批上传
    location = /api/resumes/batch {
        limit_req zone=upload_limit burst=8 nodelay;
        client_max_body_size 60m;
        client_body_timeout 120s;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 模拟面试：创建会话与提交回答都会调用大模型，后端单轮总预算 75 秒，这里略大于它。
    # 正则 location 优先于下面的 /api/ 前缀规则，避免落到 60 秒超时和轮询限流上
    location ~ ^/api/interviews(?:/[^/]+/answers)?$ {
        limit_req zone=llm_limit burst=3 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 85s;
    }

    # 任务轮询、读取全文、导出 Excel 等只读请求
    location /api/ {
        limit_req zone=poll_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 与后端错误体格式一致，前端可直接展示 message
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"请求过于频繁，请 1 分钟后再试","request_id":""}}';
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"单次上传内容过大，请减少文件数量或压缩后重试","request_id":""}}';
    }
}
